[project]
name = "account-inquiry"
version = "0.1.0"
description = "Account balance & transaction history API — DynamoDB + AppSync projection of the transfer event log"
authors = [{ name = "Li Lin", email = "guru.lin@gmail.com" }]
# CDK/synth tooling can run on anything modern; the Lambda itself is pinned to whatever
# AWS Lambda's managed runtime actually supports (see stack.py) — those are two
# different constraints and this floor is for the former.
requires-python = ">=3.13"
dependencies = [
    "aws-cdk-lib>=2.170",
    "constructs>=10.4",
    "boto3>=1.34",
    "aws-lambda-powertools>=3.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/account_inquiry"]

[dependency-groups]
dev = [
    "pytest >= 8.3.0",
    "pytest-mock >= 3.14",
    "pytest-cov >= 6.1",
    "moto[dynamodb]>=5.0",
    "pre-commit >= 4.0.1",
    "ruff>=0.15.21",
    "ty>=0.0.59",
    "requests-aws4auth>=1.3",
    "requests>=2.32",
]

[tool.uv]
managed = true

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "smoke: read-only, safe to run against the persistent/shared stack (no writes, no Kinesis records)",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.ruff]
line-length = 98
indent-width = 4
exclude = [".git", "__pycache__", "venv", ".venv", "cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "W", "C", "I", "A"]
ignore = ["E203", "E266"]

[tool.ty]

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.ty.rules]
unused-ignore-comment = "warn"
possibly-missing-import = "error"
redundant-cast = "ignore"
unresolved-import = "error"
