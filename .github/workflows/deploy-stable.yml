name: Deploy Stable Environment

# Deploys/updates the persistent "staging" stack on every push to main, then runs
# read-only smoke tests against it — no writes, no Kinesis records. The stack itself is
# never destroyed by this workflow (config.py retains data for DEPLOY_ENV=staging).

on:
  push:
    branches:
      - main
    # Manual/CLI-only scripts don't touch the deployed stack — skip the deploy +
    # smoke-test cycle when a push only changes them. Dependency files (pyproject.toml,
    # uv.lock) are deliberately NOT excluded here: they change rarely, and when they do
    # it's safer to always run the full deploy-and-verify cycle than to guess whether a
    # given lockfile bump is script-only.
    paths-ignore:
      - "scripts/**"
  workflow_dispatch:

env:
  DEPLOY_ENV: staging
  STACK_NAME: AccountInquiryStack-staging
  TESTING_STACK_NAME: AccountInquiryStack-staging

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --locked

      # No AWS creds/region here on purpose: tests/unit relies on moto (see
      # tests/conftest.py), which hardcodes us-east-1. A real AWS_DEFAULT_REGION set
      # here would silently break it — moto scopes mocked state per-region just like
      # real AWS, so the ingest handler's client wouldn't see the test fixture's table.
      - name: Unit tests
        run: uv run pytest tests/unit -q

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Deploy stable stack
        run: uv run cdk deploy --require-approval never
        env:
          AWS_DEFAULT_REGION: us-west-2
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CI_IAM_PRINCIPAL_ARN: ${{ vars.CI_IAM_PRINCIPAL_ARN }}

      - name: Smoke test (read-only)
        run: uv run pytest tests/integration -m smoke -q
        env:
          AWS_DEFAULT_REGION: us-west-2
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
